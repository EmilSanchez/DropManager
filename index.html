<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop Manager — Resumen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/kpi-cards.css">
<link rel="stylesheet" href="css/store-card.css">
<link rel="stylesheet" href="css/placeholder.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============================= SIDEBAR ============================= -->
  <aside class="sidebar">
    <div class="sidebar__user">
      <div class="sidebar__avatar" id="userAvatar">ES</div>
      <div class="sidebar__user-text">
        <div class="sidebar__user-name" id="userName">Emil Sanchez</div>
        <div class="sidebar__user-role" id="userRole">Administrador</div>
      </div>
    </div>

    <ul class="sidebar__nav" id="sidebarNav"></ul>

    <div class="sidebar__footer">
      <button class="sidebar__collapse-btn" id="collapseBtn" aria-label="Colapsar menú">
        <span id="collapseIcon"></span>
      </button>
    </div>
  </aside>

  <!-- ============================== MAIN =============================== -->
  <div class="main">

    <!-- Header -->
    <header class="header">
      <div>
        <div class="header__title" id="pageTitle">Resumen</div>
        <div class="header__subtitle" id="pageSubtitle">Resumen general de todas tus tiendas.</div>
      </div>
      <div class="header__actions">
        <div class="header__search">
          <input type="text" class="header__search-input" placeholder="Buscar venta">
          <span class="header__search-icon" id="searchIcon"></span>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="content">

      <!-- Resumen: única vista funcional por ahora -->
      <div class="view" id="view-resumen">
        <section class="kpi-row" id="kpiRow"></section>

        <hr class="section-divider">

        <section class="stores-section">
          <div class="stores-grid" id="storesGrid"></div>
        </section>
      </div>

      <!-- Placeholder compartido: se muestra para cualquier módulo aún no construido -->
      <div class="view" id="view-placeholder" hidden>
        <div class="placeholder">
          <div class="placeholder__status">
            En desarrollo
            <span class="dots"><span></span><span></span><span></span></span>
          </div>
          <div class="placeholder__hint">
            Por el momento solo el módulo Resumen está disponible. Iremos habilitando esta sección poco a poco.
          </div>
          <div class="submodules-grid" id="submodulesGrid" hidden></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/views.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/select.js"></script>
<script>
  // Small icons that live outside the render-loop templates
  document.getElementById('collapseIcon').innerHTML = Icons.chevronLeft;
  document.getElementById('searchIcon').innerHTML = Icons.search;
</script>
<script src="js/app.js"></script>

</body>
</html>
