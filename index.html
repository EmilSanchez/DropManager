<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeliManager Pro — Resumen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/kpi-cards.css">
<link rel="stylesheet" href="css/store-card.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============================= SIDEBAR ============================= -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__logo" id="logoIcon"></div>
      <div class="sidebar__brand-text">
        <div class="sidebar__brand-name">MeliManager</div>
        <div class="sidebar__brand-tag">Pro</div>
      </div>
    </div>

    <div class="sidebar__user">
      <div class="sidebar__avatar" id="userAvatar">JM</div>
      <div class="sidebar__brand-text">
        <div class="sidebar__user-name" id="userName">Juan Martínez</div>
        <div class="sidebar__user-role" id="userRole">Administrador</div>
      </div>
    </div>

    <ul class="sidebar__nav" id="sidebarNav"></ul>

    <div class="sidebar__footer">
      <button class="sidebar__collapse-btn" id="collapseBtn">
        <span id="collapseIcon"></span>
        <span>Colapsar</span>
      </button>
    </div>
  </aside>

  <!-- ============================== MAIN =============================== -->
  <div class="main">

    <!-- Header -->
    <header class="header">
      <div>
        <div class="header__title">Resumen</div>
        <div class="header__subtitle">Resumen general de todas tus tiendas.</div>
      </div>
      <div class="header__actions">
        <button class="icon-btn" aria-label="Notificaciones">
          <span id="bellIcon"></span>
          <span class="icon-btn__badge"></span>
        </button>
        <button class="icon-btn" aria-label="Configuración">
          <span id="settingsIcon"></span>
        </button>
        <button class="btn btn--secondary">
          <span id="fileIcon"></span>
          Términos y condiciones
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="content">

      <!-- KPI row -->
      <section class="kpi-row" id="kpiRow"></section>

      <!-- Stores -->
      <section class="stores-section">
        <div class="stores-section__header">
          <div class="stores-section__title">Tus tiendas <span id="storesCount">(0)</span></div>
        </div>
        <div class="stores-grid" id="storesGrid"></div>
      </section>

    </main>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/select.js"></script>
<script>
  // Small icons that live outside the render-loop templates
  document.getElementById('logoIcon').innerHTML = Icons.store;
  document.getElementById('collapseIcon').innerHTML = Icons.chevronLeft;
  document.getElementById('bellIcon').innerHTML = Icons.bell;
  document.getElementById('settingsIcon').innerHTML = Icons.settings;
  document.getElementById('fileIcon').innerHTML = Icons.fileText;
</script>
<script src="js/app.js"></script>

</body>
</html>
